[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-platform"
version = "0.1.0"
description = "Self-hostable benchmark platform: bring your own agent, run it against evals, get scores, costs, and trajectories."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "docker>=7.1",
    "typer>=0.15",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
bench = "bench.cli:app"

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: test requires a running Docker daemon (deselect with -m 'not docker')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
