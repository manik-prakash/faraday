id: g007-1984-author
name: Author of 1984
description: Who wrote the novel Nineteen Eighty-Four.
version: "1"
instruction: >-
  Who wrote the novel "Nineteen Eighty-Four"? Write only the author's full name to
  output/answer.txt.
grader:
  type: file-match
  path: output/answer.txt
  expect: "George Orwell"
  mode: exact
  ignore_case: true
limits: { cpus: 1.0, memory_mb: 256, timeout_s: 120 }
