id: g005-largest-planet
name: Largest Planet
description: Largest planet in the solar system.
version: "1"
instruction: >-
  What is the largest planet in our solar system? Write only its name to
  output/answer.txt.
grader:
  type: file-match
  path: output/answer.txt
  expect: "Jupiter"
  mode: exact
  ignore_case: true
limits: { cpus: 1.0, memory_mb: 256, timeout_s: 120 }
