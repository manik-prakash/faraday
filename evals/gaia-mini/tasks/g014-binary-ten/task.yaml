id: g014-binary-ten
name: Ten in Binary
description: Convert 10 to binary.
version: "1"
instruction: >-
  Write the number ten in binary. Output only the binary digits to output/answer.txt.
grader:
  type: file-match
  path: output/answer.txt
  expect: "1010"
  mode: exact
limits: { cpus: 1.0, memory_mb: 256, timeout_s: 120 }
