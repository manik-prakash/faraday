id: g002-capital-australia
name: Capital of Australia
description: Name the capital city of Australia.
version: "1"
instruction: >-
  What is the capital city of Australia? Write only the city name to
  output/answer.txt.
grader:
  type: file-match
  path: output/answer.txt
  expect: "Canberra"
  mode: exact
  ignore_case: true
limits: { cpus: 1.0, memory_mb: 256, timeout_s: 120 }
