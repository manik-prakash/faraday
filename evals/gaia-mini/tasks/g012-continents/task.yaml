id: g012-continents
name: Continent Count
description: Number of continents.
version: "1"
instruction: >-
  How many continents are there on Earth? Write only the number to output/answer.txt.
grader:
  type: file-match
  path: output/answer.txt
  expect: "7"
  mode: exact
limits: { cpus: 1.0, memory_mb: 256, timeout_s: 120 }
