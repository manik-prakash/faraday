id: g015-japan-currency
name: Currency of Japan
description: Official currency of Japan.
version: "1"
instruction: >-
  What is the official currency of Japan? Write only its name to output/answer.txt.
grader:
  type: file-match
  path: output/answer.txt
  expect: "yen"
  mode: exact
  ignore_case: true
limits: { cpus: 1.0, memory_mb: 256, timeout_s: 120 }
