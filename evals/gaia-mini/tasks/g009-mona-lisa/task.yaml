id: g009-mona-lisa
name: Mona Lisa Painter
description: Who painted the Mona Lisa.
version: "1"
instruction: >-
  Who painted the Mona Lisa? Write only the painter's full name to output/answer.txt.
grader:
  type: file-match
  path: output/answer.txt
  expect: "Leonardo da Vinci"
  mode: exact
  ignore_case: true
limits: { cpus: 1.0, memory_mb: 256, timeout_s: 120 }
